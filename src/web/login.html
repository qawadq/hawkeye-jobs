<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="referrer" content="no-referrer">
  <title>تسجيل الدخول · Hawkeye Jobs</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login.css">
  <script defer src="/login.js"></script>
</head>
<body>
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="title">
      <img src="/icon.svg" width="68" height="68" alt="">
      <p class="eyebrow">HAWKEYE JOBS</p>
      <h1 id="title">مساحة العمل الشخصية</h1>
      <p class="subtitle">أدخل كلمة المرور لفتح لوحة الوظائف الخاصة بك.</p>
      <form id="login-form">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               minlength="12" required autofocus>
        <button id="submit" type="submit">دخول</button>
        <p id="message" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
